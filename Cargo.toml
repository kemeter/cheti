[package]
name = "cheti"
version = "0.1.0"
edition = "2021"
authors = ["Mlanawo Mbechezi <mlanawo.mbechezi@kemeter.io>"]
license = "MIT"
description = "ACME DNS-01 challenge library with pluggable DNS providers"
repository = "https://github.com/kemeter/cheti"
readme = "README.md"
keywords = ["acme", "letsencrypt", "dns", "tls", "certificate"]
categories = ["cryptography", "network-programming"]

[dependencies]
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hickory-resolver = "0.24"
tokio = { version = "1", features = ["time", "rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
url = "2"
percent-encoding = "2"
instant-acme = "0.8"
sha1 = "0.10"
hex = "0.4"
x509-parser = "0.16"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"
time = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
