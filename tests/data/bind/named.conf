// Test-only BIND configuration for tests/rfc2136_bind.rs. The keys below are
// throwaway values; never reuse them outside this test setup.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    dnssec-validation no;
};

key "cheti-sha256" {
    algorithm hmac-sha256;
    secret "Y2hldGktdGVzdC1zZWNyZXQtZm9yLXRzaWctaG1hYyEh";
};

key "cheti-sha512" {
    algorithm hmac-sha512;
    secret "Y2hldGktYmluZC1zaGE1MTItdGVzdC1zZWNyZXQtMDEyMzQ1Njc4OQ==";
};

zone "example.com" {
    type primary;
    file "/var/lib/bind/example.com.zone";
    update-policy {
        grant cheti-sha256 zonesub TXT;
        grant cheti-sha512 zonesub TXT;
    };
};
